<!DOCTYPE html>
<html>
<head>
    <title>Dev</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: black;
            color: white;
            margin-top: 100px;
        }

        h1 {
            font-size: 35px;
        }

        button {
            padding: 15px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px;
        }

        #yes {
            background: green;
            color: white;
        }

        #no {
            background: red;
            color: white;
            position: absolute;
        }

        .heart {
            font-size: 100px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>Forgiven ?</h1>

    <button id="yes" onclick="showLove()">YES</button>
    <button id="no">NO</button>

    <script>
        // NO button bhagega (desktop + mobile)
        let noBtn = document.getElementById("no");

        function moveNoButton() {
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 100);

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        // Desktop hover
        noBtn.addEventListener("mouseover", moveNoButton);

        // Mobile touch
        noBtn.addEventListener("touchstart", moveNoButton);

        // YES click
        function showLove() {
            document.body.innerHTML = `
                <h1>Good Girl🎀</h1>
                
            `;
        }
    </script>

</body>
</html>
